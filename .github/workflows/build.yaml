name: Build & release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.TrailerPreroll/Jellyfin.Plugin.TrailerPreroll.csproj -c Release

      - name: Package zip (DLL + meta.json)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="1.0.0.0"
          mkdir -p artifacts/pkg
          cp Jellyfin.Plugin.TrailerPreroll/bin/Release/net9.0/Jellyfin.Plugin.TrailerPreroll.dll artifacts/pkg/
          cp meta.json artifacts/pkg/
          (cd artifacts/pkg && zip -r "../trailer-preroll_${VERSION}.zip" .)
          echo "MD5 checksum (put this in manifest.json):"
          md5sum artifacts/trailer-preroll_*.zip

      - name: Attach zip to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/trailer-preroll_*.zip
